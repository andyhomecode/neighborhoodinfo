services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: neighborhoodinfo
      POSTGRES_USER: neighborhoodinfo
      POSTGRES_PASSWORD: neighborhoodinfo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neighborhoodinfo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://neighborhoodinfo:neighborhoodinfo@postgis:5432/neighborhoodinfo
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  pgdata:
